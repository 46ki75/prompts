[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
authors = ["Ikuma Yamashita <46ki75@gmail.com>"]
repository = "https://github.com/46ki75/prompts"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.lints.rust]
missing_docs = "warn"
